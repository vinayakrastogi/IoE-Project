services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking}
      POSTGRES_DB: ${POSTGRES_DB:-parking}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  ml-trainer:
    build: ./ml
    volumes:
      - ./ml/models:/app/models
      - ./ml/data:/app/data

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ml-trainer:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD:-parking}@postgres:5432/${POSTGRES_DB:-parking}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      QR_SECRET: ${QR_SECRET:-dev-qr-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-123456789}
      TOTAL_SLOTS: ${TOTAL_SLOTS:-20}
      ML_MODEL_DIR: /app/ml_models
      # "*" (not just localhost:5173) so the frontend also works when opened
      # from another device on the LAN, e.g. a phone at http://<lan-ip>:5173 -
      # fine for a local demo tool, not meant to be internet-facing.
      CORS_ORIGINS: '["*"]'
    volumes:
      - ./ml/models:/app/ml_models:ro
    ports:
      - "8000:8000"

  # ---- IoT layer ---------------------------------------------------------------
  # The six Arduino Unos of the lot (five 4-bay zone controllers + the gate
  # controller), running the REAL compiled firmware from firmware/build/*.hex on
  # an instruction-accurate AVR emulator (avr8js, the engine behind Wokwi). The
  # sensors measure a virtual world; open http://localhost:5173/hardware to
  # watch the boards, wiring, LEDs, servo and LCD live. No hardware logic is
  # scripted here -- it all comes from the firmware.
  hardware-lab:
    build: ./hardware-lab
    depends_on:
      - mosquitto
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      FIRMWARE_DIR: /firmware
    volumes:
      - ./firmware:/firmware:ro
    ports:
      - "8090:8090"

  # The Raspberry Pi of the installation: the Arduinos have no network, so each
  # one is wired to the Pi over a serial link and this gateway translates their
  # UART frames to MQTT (and back). Same script as on a real Pi; here the
  # "serial ports" are the lab's TCP sockets.
  pi-gateway:
    build: ./gateway
    depends_on:
      - mosquitto
      - hardware-lab
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      GATEWAY_NODES: "zone-a=socket://hardware-lab:7001,zone-b=socket://hardware-lab:7002,zone-c=socket://hardware-lab:7003,zone-d=socket://hardware-lab:7004,zone-e=socket://hardware-lab:7005,gate=socket://hardware-lab:7010"
      TOTAL_SLOTS: ${TOTAL_SLOTS:-20}

  # Legacy pure-Python stand-ins for the hardware, kept for generating "busy
  # day" traffic for the ML peak-prediction demo. They publish on the same MQTT
  # topics as the gateway, so do NOT run them together with hardware-lab:
  #   docker compose stop hardware-lab pi-gateway
  #   docker compose --profile simulation up -d sensor-sim gate-sim
  sensor-sim:
    build: ./hardware-sim
    profiles: ["simulation"]
    command: ["python", "sensor_simulator.py", "--speed", "60"]
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      TOTAL_SLOTS: ${TOTAL_SLOTS:-20}

  gate-sim:
    build: ./hardware-sim
    profiles: ["simulation"]
    command: ["python", "gate_simulator.py"]
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # No VITE_API_URL here on purpose: the frontend infers the backend's
    # address from whatever host it was itself loaded from (see
    # frontend/src/api/client.js), so the same build works from
    # http://localhost:5173 on this machine AND http://<lan-ip>:5173 from a
    # phone on the same network. Set VITE_API_URL in frontend/.env only if
    # the backend is reachable at a different host/port than the frontend.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
  mosquitto_data:
  frontend_node_modules:
